<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Loops backend</title>
    <style>
      :root {
        --bg: #e4e9e6;
        --card: #fbfcf7;
        --ink: #1e2a24;
        --muted: #5f6b64;
        --green: #2f5d4a;
        --line: #d4dbd6;
        --blue: #1f7bb8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        padding: 28px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      .pill {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .pill b {
        color: var(--green);
      }
      main {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 18px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px 18px;
        min-height: 520px;
      }
      h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        border-top: 1px solid var(--line);
        padding: 8px 0;
        animation: in 0.35s ease-out;
      }
      @keyframes in {
        from {
          background: #e3f0e8;
        }
      }
      code {
        font:
          12.5px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        word-break: break-word;
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
      }
      .tag {
        font-weight: 600;
        color: var(--green);
      }
      .tag.cortex {
        color: var(--blue);
      }
      .tag.error {
        color: #b3261e;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--muted);
        font-weight: 500;
        padding: 4px 6px;
      }
      td {
        border-top: 1px solid var(--line);
        padding: 6px;
        vertical-align: top;
      }
      td.detail {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        color: var(--muted);
      }
      .ev {
        font-weight: 600;
      }
      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Open Loops backend</h1>
      <span class="pill" id="evidence">connecting</span>
      <span class="pill" id="model"></span>
      <span class="pill" id="writes"></span>
    </header>
    <main>
      <section>
        <h2>Snowflake statements, live</h2>
        <ol id="queries">
          <li class="empty">No statements yet. Start a scan in the companion.</li>
        </ol>
      </section>
      <section>
        <h2>OPEN_LOOPS.PUBLIC.LOOP_JOURNAL</h2>
        <table>
          <thead>
            <tr>
              <th>At</th>
              <th>Loop</th>
              <th>Event</th>
              <th>Detail</th>
            </tr>
          </thead>
          <tbody id="journal"></tbody>
        </table>
      </section>
    </main>
    <script src="assets/backend.js"></script>
  </body>
</html>
