<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="856" viewBox="0 0 1012 856">
  <title>Pip's pocket — flat 5:7 card with X and check controls</title>
  <desc>
    Static design reference. Flat fills and thin borders only, without shadows. Left: a 5:7 quest
    card above a red X for snooze choices and green check for task choices. Right: numbered steps
    with fixed Back and Close. Neither circular control dispatches work.
  </desc>
  <defs>
    <symbol id="pip" viewBox="0 0 32 32">
      <g shape-rendering="crispEdges">
        <path fill="#4b485b" d="M15 12V8h2V6h4v4h-2v2zM11 24h4v4H9v-2h2zm7 0h4v2h2v2h-6z" />
        <path fill="#9fbf99" d="M17 8h3v1h-2v2h-1z" />
        <path
          fill="#4b485b"
          fill-rule="evenodd"
          d="M12 11h8v2h3v3h2v7h-2v3H11v-2H8V15h2v-2h2zM14 15v4h5v-4z"
        />
        <path
          fill="#c8b7e6"
          fill-rule="evenodd"
          d="M12 13h8v2h3v8h-2v2H11v-3H10v-7h2zM13 14v6h7v-6z"
        />
        <path fill="#9484b5" d="M21 16h2v7h-2v2H11v-2h9v-3h1z" />
        <path fill="#fff6e4" d="M12 14h1v4h-2v-3h1zm3-1h4v1h-4z" />
        <path fill="#4b485b" d="M12 21h2v2h-2zm6 0h2v2h-2zm-3 2h2v1h-2z" />
        <path fill="#e8b49c" d="M10 23h2v1h-2zm10 0h2v1h-2z" />
      </g>
    </symbol>
    <g id="rail">
      <use href="#pip" x="0" y="24" width="128" height="128" />
      <text x="128" y="82" font-size="16" font-weight="650">Pip</text>
      <rect x="162" y="67" width="56" height="20" rx="5" fill="#E3E9DF" />
      <text x="190" y="81" text-anchor="middle" font-size="10" fill="#58665D">Preview</text>
      <text x="128" y="106" font-size="12" fill="#58665D">0 XP · Scout at 20</text>
      <rect x="128" y="118" width="112" height="4" rx="2" fill="#CCD5C7" />
      <g
        stroke="#58665D"
        fill="none"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M305 22h4l5-4v16l-5-4h-4z M318 22q6 4 0 8" />
        <path d="m351 21 10 10m0-10-10 10" />
      </g>
    </g>
  </defs>
  <rect width="1012" height="856" fill="#E9EDE9" />
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#27332D">
    <text x="64" y="36" font-size="12" font-weight="600">Open Loops</text>
    <text x="948" y="36" text-anchor="end" font-size="12" fill="#58665D">
      Revised static reference · not a native window
    </text>
    <text x="64" y="80" font-size="12" font-weight="600" fill="#58665D">
      5:7 poker card · only this card moves
    </text>
    <text x="558" y="80" font-size="12" font-weight="600" fill="#58665D">
      Secondary view · fixed top-left Back
    </text>
    <g transform="translate(64 104)">
      <rect width="390" height="664" rx="24" fill="#F0F2EC" stroke="#CCD4C9" />
      <use href="#rail" />
      <text x="72" y="30" font-size="13" font-weight="600">Quests</text>
      <rect
        x="70.2"
        y="182.56"
        width="249.6"
        height="349.44"
        rx="18"
        fill="#D5DFCF"
        stroke="#C4D0BE"
      />
      <rect
        x="67.6"
        y="163.28"
        width="254.8"
        height="356.72"
        rx="18"
        fill="#E4EBDD"
        stroke="#CCD4C9"
      />
      <rect x="65" y="144" width="260" height="364" rx="18" fill="#FFFEFA" stroke="#CCD4C9" />
      <text x="85" y="178" font-size="12" fill="#58665D">1 of 3</text>
      <text x="305" y="178" text-anchor="end" font-size="12" fill="#58665D">92 days open</text>
      <text x="85" y="226" font-size="26" font-weight="650" letter-spacing="-.65">
        Laptop arrived.
      </text>
      <text x="85" y="258" font-size="26" font-weight="650" letter-spacing="-.65">
        Request still
      </text>
      <text x="85" y="290" font-size="26" font-weight="650" letter-spacing="-.65">open.</text>
      <text x="85" y="334" font-size="15" fill="#58665D">Maya flagged this</text>
      <text x="85" y="356" font-size="15" fill="#58665D">request as a duplicate.</text>
      <text x="85" y="472" font-size="13" fill="#355F50">2 sources · REQ-184</text>
      <path d="M85 477h122" stroke="#355F50" stroke-opacity=".4" />
      <circle cx="143" cy="592" r="36" fill="#FFFEFA" stroke="#D84B5A" stroke-opacity=".5" />
      <svg x="128" y="577" width="30" height="30" viewBox="0 0 24 24">
        <path
          d="m5 5 14 14m0-14L5 19"
          fill="none"
          stroke="#D84B5A"
          stroke-width="3.2"
          stroke-linecap="round"
        />
      </svg>
      <text x="143" y="648" text-anchor="middle" font-size="12" font-weight="600">Later</text>
      <circle cx="247" cy="592" r="36" fill="#FFFEFA" stroke="#169B72" stroke-opacity=".5" />
      <svg x="232" y="577" width="30" height="30" viewBox="0 0 24 24">
        <path
          d="m5 12 4 4L19 6"
          fill="none"
          stroke="#169B72"
          stroke-width="3.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <text x="247" y="648" text-anchor="middle" font-size="12" font-weight="600">Next step</text>
    </g>
    <g transform="translate(558 104)">
      <rect width="390" height="520" rx="24" fill="#F0F2EC" stroke="#CCD4C9" />
      <use href="#rail" />
      <rect x="12" y="4" width="44" height="44" rx="10" fill="#E3E9DF" />
      <path
        d="m36 18-8 8 8 8m-8-8h14"
        fill="none"
        stroke="#27332D"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <text x="72" y="23" font-size="13" font-weight="600">Next step</text>
      <text x="72" y="39" font-size="11" fill="#58665D">REQ-184</text>
      <text x="24" y="180" font-size="22" font-weight="650" letter-spacing="-.4">
        What should I prepare?
      </text>
      <g transform="translate(24 212)">
        <text y="20" font-size="14" font-weight="600">
          <tspan fill="#667267">1.</tspan>
          Check the duplicate evidence
        </text>
        <text x="18" y="42" font-size="12" fill="#58665D">Read the two supplied records.</text>
        <path d="M0 64h342" stroke="#CCD4C9" />
        <text y="100" font-size="14" font-weight="600">
          <tspan fill="#667267">2.</tspan>
          Draft a closure recommendation
        </text>
        <text x="18" y="122" font-size="12" fill="#58665D">
          Prepare a recommendation. Close nothing.
        </text>
        <path d="M0 144h342" stroke="#CCD4C9" />
        <text y="180" font-size="14" font-weight="600">
          <tspan fill="#667267">3.</tspan>
          Draft a question for Maya
        </text>
        <text x="18" y="202" font-size="12" fill="#58665D">Write a question. Send nothing.</text>
      </g>
      <text x="24" y="478" font-size="13" fill="#355F50">View evidence</text>
      <path d="M24 483h84" stroke="#355F50" stroke-opacity=".4" />
    </g>
    <text x="64" y="822" font-size="12" fill="#58665D">
      Flat fills and thin borders. No shadows. Red X / green check. Geometry and action semantics
      unchanged.
    </text>
  </g>
</svg>
